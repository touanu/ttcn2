openapi: 3.0.0
info:
  title: English Learning Platform API
  description: |
    Comprehensive API documentation for the English Learning Platform.

    ## Authentication
    Most endpoints require JWT authentication. Use the `/auth/login` endpoint to obtain access and refresh tokens.

    ## Rate Limiting
    Some endpoints have rate limiting enabled to prevent abuse.
  version: 1.0.0
  contact:
    name: API Support
    email: support@englearn.com

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.englearn.com
    description: Production server

tags:
  - name: auth
    description: Authentication and session management
  - name: users
    description: User account management and operations

paths:
  # Authentication endpoints
  /auth/login:
    post:
      tags: [auth]
      summary: User Login
      description: Authenticate user and create a new session. Returns access token, refresh token, and session ID.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        400:
          description: Invalid credentials or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [auth]
      summary: User Logout
      description: Invalidate the current session and log out the user.
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        200:
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        400:
          description: Invalid session ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized - Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh Access Token
      description: Use refresh token to obtain a new access token without requiring login again.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        200:
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        400:
          description: Invalid request or token format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          description: Too many refresh attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # User endpoints
  /users:
    get:
      tags: [users]
      summary: Get All Users
      description: Retrieve a list of all registered users in the system.
      operationId: getUsers
      responses:
        200:
          description: Successfully retrieved user list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [users]
      summary: Create New User
      description: Register a new user account with email, username, password, and full name.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: Validation error or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: User already exists (duplicate email or username)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    get:
      tags: [users]
      summary: Get User By ID
      description: Retrieve detailed information about a specific user.
      operationId: getUserById
      parameters:
        - name: id
          in: path
          description: User ID (MongoDB ObjectId)
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{24}$'
            example: '507f1f77bcf86cd799439011'
      responses:
        200:
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [users]
      summary: Update User
      description: Update user information. All fields are optional.
      operationId: updateUser
      parameters:
        - name: id
          in: path
          description: User ID (MongoDB ObjectId)
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{24}$'
            example: '507f1f77bcf86cd799439011'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        200:
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        409:
          description: Conflict (e.g., duplicate email or username)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [users]
      summary: Delete User
      description: Permanently delete a user account from the system.
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          description: User ID (MongoDB ObjectId)
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{24}$'
            example: '507f1f77bcf86cd799439011'
      responses:
        204:
          description: User deleted successfully
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/request-verify-email:
    post:
      tags: [users]
      summary: Request Email Verification
      description: Send an OTP code to user's email for verification. Requires either email or username.
      operationId: requestEmailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestVerifyEmailRequest'
      responses:
        200:
          description: Verification email sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestVerifyEmailResponse'
        400:
          description: Validation error - email or username required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/verify-email:
    post:
      tags: [users]
      summary: Verify Email with OTP
      description: Verify user's email address using OTP code or hash received via email.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        200:
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        400:
          description: Invalid or expired OTP/hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          description: Too many verification attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/verify-email/{token}:
    get:
      tags: [users]
      summary: Verify Email via Token Link
      description: Verify email using a token from the verification link (one-click verification).
      operationId: verifyEmailByToken
      parameters:
        - name: token
          in: path
          description: Verification token from email link
          required: true
          schema:
            type: string
      responses:
        200:
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        400:
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          description: Too many verification attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/forgot-password:
    post:
      tags: [users]
      summary: Request Password Reset
      description: Send password reset OTP to user's email address.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        200:
          description: Password reset email sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/reset-password:
    post:
      tags: [users]
      summary: Reset Password with OTP
      description: Reset user password using OTP code or hash from email along with new password.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        200:
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        400:
          description: Invalid OTP/hash or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          description: Too many reset attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/reset-password/{token}:
    post:
      tags: [users]
      summary: Reset Password via Token Link
      description: Reset password using token from reset link (one-click method).
      operationId: verifyPasswordResetToken
      parameters:
        - name: token
          in: path
          description: Password reset token from email link
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetByTokenRequest'
      responses:
        200:
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        400:
          description: Invalid or expired token, or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          description: Too many reset attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login endpoint

  schemas:
    # Auth schemas
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          description: User's username
          example: johndoe
        password:
          type: string
          minLength: 8
          maxLength: 64
          format: password
          description: |
            User's password. Must contain:
            - At least 8 characters
            - At least one uppercase letter
            - At least one lowercase letter
            - At least one digit
            - At least one special character
          example: SecurePass123!

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login successful
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                  example: '507f1f77bcf86cd799439011'
                role:
                  type: string
                  example: student
                name:
                  type: string
                  example: John Doe
            accessToken:
              type: object
              properties:
                token:
                  type: string
                  description: JWT access token
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                expiresIn:
                  type: number
                  description: Token expiration time in seconds
                  example: 3600
            refreshToken:
              type: object
              properties:
                token:
                  type: string
                  description: JWT refresh token
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                expiresIn:
                  type: number
                  description: Token expiration time in seconds
                  example: 604800
            sessionId:
              type: string
              description: Session identifier
              example: '507f1f77bcf86cd799439012'

    LogoutRequest:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          pattern: '^[0-9a-f]{24}$'
          description: Session ID to invalidate
          example: '507f1f77bcf86cd799439012'

    RefreshTokenRequest:
      type: object
      required:
        - sessionId
        - refreshToken
      properties:
        sessionId:
          type: string
          pattern: '^[0-9a-f]{24}$'
          description: Current session ID
          example: '507f1f77bcf86cd799439012'
        refreshToken:
          type: string
          description: Valid refresh token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    RefreshTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Token refreshed successfully
        data:
          type: object
          properties:
            accessToken:
              type: object
              properties:
                token:
                  type: string
                  description: New JWT access token
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                expiresIn:
                  type: number
                  description: Token expiration time in seconds
                  example: 3600
            refreshToken:
              type: object
              properties:
                token:
                  type: string
                  description: New JWT refresh token
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                expiresIn:
                  type: number
                  example: 604800
            sessionId:
              type: string
              example: '507f1f77bcf86cd799439012'

    # User schemas
    User:
      type: object
      properties:
        _id:
          type: string
          description: User's unique identifier
          example: '507f1f77bcf86cd799439011'
        username:
          type: string
          minLength: 3
          maxLength: 30
          description: Unique username
          example: johndoe
        email:
          type: string
          format: email
          description: User's email address
          example: john.doe@example.com
        isEmailVerified:
          type: boolean
          description: Email verification status
          example: true
        fullName:
          type: string
          minLength: 3
          maxLength: 100
          description: User's full name
          example: John Doe
        role:
          type: string
          enum: [student, teacher, admin]
          description: User role in the system
          example: student
        profilePictureUrl:
          type: string
          format: uri
          description: URL to user's profile picture
          example: https://example.com/avatars/johndoe.jpg
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp
          example: '2025-01-01T00:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2025-01-05T12:30:00.000Z'

    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - password
        - fullName
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          description: Desired username
          example: johndoe
        email:
          type: string
          format: email
          description: User's email address
          example: john.doe@example.com
        password:
          type: string
          minLength: 8
          maxLength: 64
          format: password
          description: |
            User's password. Must contain:
            - At least 8 characters
            - At least one uppercase letter
            - At least one lowercase letter
            - At least one digit
            - At least one special character
          example: SecurePass123!
        fullName:
          type: string
          minLength: 3
          maxLength: 100
          description: User's full name
          example: John Doe

    UpdateUserRequest:
      type: object
      description: All fields are optional. Only provided fields will be updated.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: johndoe2
        email:
          type: string
          format: email
          example: newemail@example.com
        password:
          type: string
          minLength: 8
          maxLength: 64
          format: password
          example: NewSecurePass456!
        fullName:
          type: string
          minLength: 3
          maxLength: 100
          example: John Michael Doe

    RequestVerifyEmailRequest:
      type: object
      description: Provide either email or username to request verification
      properties:
        email:
          type: string
          format: email
          nullable: true
          example: john.doe@example.com
        username:
          type: string
          minLength: 3
          maxLength: 30
          nullable: true
          example: johndoe
      oneOf:
        - required: [email]
        - required: [username]

    RequestVerifyEmailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Verification email sent successfully
        data:
          type: object
          properties:
            email:
              type: string
              format: email
              description: Email address where OTP was sent
              example: john.doe@example.com

    EmailVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: john.doe@example.com
        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'
          nullable: true
          description: 6-digit OTP code from email
          example: '123456'
        hash:
          type: string
          nullable: true
          description: Hash token from email link (alternative to OTP)
          example: abc123def456
      oneOf:
        - required: [otp]
        - required: [hash]

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: User's registered email address
          example: john.doe@example.com

    PasswordResetRequest:
      type: object
      required:
        - email
        - newPassword
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: john.doe@example.com
        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'
          nullable: true
          description: 6-digit OTP code from email
          example: '123456'
        hash:
          type: string
          nullable: true
          description: Hash token from email link (alternative to OTP)
          example: abc123def456
        newPassword:
          type: string
          minLength: 8
          maxLength: 64
          format: password
          description: |
            New password. Must contain:
            - At least 8 characters
            - At least one uppercase letter
            - At least one lowercase letter
            - At least one digit
            - At least one special character
          example: NewSecurePass789!
      oneOf:
        - required: [otp]
        - required: [hash]

    PasswordResetByTokenRequest:
      type: object
      required:
        - newPassword
      properties:
        newPassword:
          type: string
          minLength: 8
          maxLength: 64
          format: password
          description: |
            New password. Must contain:
            - At least 8 characters
            - At least one uppercase letter
            - At least one lowercase letter
            - At least one digit
            - At least one special character
          example: NewSecurePass789!

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true
          description: Optional response data

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: An error occurred
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            details:
              type: object
              nullable: true
              description: Additional error details
