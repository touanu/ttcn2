shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - chokidar
  - semver
  - synckit
  - undici-types
  - ts-api-utils

packages:
  - apps/*
  - packages/*

overrides:
  '@shared/config': workspace:*
  '@shared/constants': workspace:*
  '@shared/interfaces': workspace:*
  '@shared/schemas': workspace:*
  '@shared/types': workspace:*
  '@shared/utils': workspace:*
  vite: npm:rolldown-vite@7.1.14

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@scarf/scarf'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - esbuild
  - sharp
  - simple-git-hooks
  - unrs-resolver
  - vue-demi
